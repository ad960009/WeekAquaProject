name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Binary
        run: |
          dotnet publish WeekAquaWPF/WeekAquaWPF.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/SelfContained
          Remove-Item -Path publish/SelfContained/*.pdb -Force -ErrorAction SilentlyContinue
          tar -a -c -f publish/WeekAquaWPF-win-x64-SelfContained.zip -C publish/SelfContained WeekAquaWPF.exe

      - name: Publish Framework-Dependent Binary
        run: |
          dotnet publish WeekAquaWPF/WeekAquaWPF.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true -o publish/FrameworkDependent
          Remove-Item -Path publish/FrameworkDependent/*.pdb -Force -ErrorAction SilentlyContinue
          tar -a -c -f publish/WeekAquaWPF-win-x64-FrameworkDependent.zip -C publish/FrameworkDependent WeekAquaWPF.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WeekAqua Desktop v${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/WeekAquaWPF-win-x64-SelfContained.zip
            publish/WeekAquaWPF-win-x64-FrameworkDependent.zip
            publish/SelfContained/WeekAquaWPF.exe
            publish/FrameworkDependent/WeekAquaWPF.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
